[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hots"
version = "0.1.0"
description = "Homophily-aware Temperature Scaling for graph neural network calibration"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Inwoo Tae" },
    { name = "Yongjae Lee" },
]
keywords = ["calibration", "graph neural networks", "temperature scaling", "homophily"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch==2.4.0",
    "dgl==2.4.0",
    "torch-geometric>=2.4.0",
    "numpy>=1.24.0,<2",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "ogb>=1.3.6",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.urls]
Repository = "https://github.com/inu0104/HoTS"

[tool.setuptools.packages.find]
where = ["."]
include = ["hots*"]
exclude = ["scripts*", "configs*", "results*", "tests*"]
